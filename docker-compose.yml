services:
  hermess-app:
    container_name: hermess-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # NOTE : L'image Docker contient déjà TOUS les médias (photos, audios, vidéos, transcripts).
    # Ne décommentez les volumes ci-dessous QUE si vous avez des fichiers réels dans ces dossiers hôtes,
    # sinon un dossier hôte vide masquerait les fichiers internes de l'image.
    # volumes:
    #   - ./public/carres:/usr/share/nginx/html/carres:ro
    #   - ./public/expo:/usr/share/nginx/html/expo:ro



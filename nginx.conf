server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Inclusion des types MIME standards
    include /etc/nginx/mime.types;

    # Sécurité générale
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Compression Gzip (uniquement pour les fichiers texte, jamais pour les médias)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Fichiers audio et vidéo (streaming HTTP Range 206 natif)
    location ~* \.(m4a|mp3|mp4|mov)$ {
        gzip off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # Images et polices avec mise en cache longue durée
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Transcriptions et données JSON / Markdown (évite la redirection SPA vers index.html en cas de 404)
    location ~* \.(json|md)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Bundles JS et CSS avec hash dans le nom (immutables)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html : jamais mis en cache pour forcer la prise en compte des nouveaux déploiements SPA
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Routage Angular SPA pour toutes les autres routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gestion des erreurs HTTP
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
